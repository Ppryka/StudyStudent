<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Study Student - Tablica Ogłoszeń</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
        }

        /* Górny pasek nawigacyjny z prototypu */
        .navbar {
            background-color: #2c3e50;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
        }

        .logo {
            font-weight: bold;
            font-size: 1.2em;
            color: #f39c12;
        }

        .user-info {
            font-size: 0.9em;
            color: #bdc3c7;
        }

        /* Układ dwukolumnowy */
        .main-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
        }

        /* Lewy panel filtrów (US-03) */
        .sidebar {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            height: fit-content;
        }

        .sidebar h3 {
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .filter-group {
            margin-bottom: 15px;
        }

        .filter-group label {
            display: block;
            font-size: 0.85em;
            color: #7f8c8d;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .filter-group input,
        .filter-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .btn-filtr {
            width: 100%;
            background: #3498db;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }

        .btn-filtr:hover {
            background: #2980b9;
        }

        .btn-wyczysc {
            width: 100%;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 8px;
        }

        .btn-wyczysc:hover {
            background: #c0392b;
        }

        /* Prawa strona: Ogłoszenia */
        .content h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            margin-bottom: 15px;
        }

        .card h3 {
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .card p {
            font-size: 0.9em;
            color: #555;
            margin-bottom: 5px;
        }

        .meta {
            font-size: 0.85em;
            color: #7f8c8d;
            margin-top: 10px;
            border-top: 1px solid #eee;
            padding-top: 8px;
        }

        /* Komunikat o braku wyników */
        .alert-box {
            background: #ffeaa7;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            color: #d35400;
            font-weight: bold;
        }

        /* Pływający przycisk dodawania (+) */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background-color: #e67e22;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            border: none;
        }

        .fab:hover {
            background-color: #d35400;
        }

        /* Okienko modalne dodawania */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 350px;
        }

        .modal-content input,
        .modal-content select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">🎓 Study Student</div>
        <div class="user-info">Katarzyna N.</div>
    </div>

    <div class="main-container">
        <!-- Lewy panel: Filtry z US-03 -->
        <div class="sidebar">
            <h3>Filtry wyszukiwania</h3>

            <div class="filter-group">
                <label>Uczelnia</label>
                <input type="text" id="uczelnia" placeholder="np. Politechnika Warszawska">
            </div>

            <div class="filter-group">
                <label>Przedmiot</label>
                <input type="text" id="przedmiot" placeholder="np. Analiza">
            </div>

            <div class="filter-group">
                <label>Forma spotkań</label>
                <select id="forma">
                    <option value="">Wszystkie</option>
                    <option value="stacjonarna">Stacjonarna</option>
                    <option value="online">Online</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Maks. lokalizacja (dystans w km)</label>
                <input type="number" id="dystans" step="0.5" placeholder="np. 2">
            </div>

            <button class="btn-filtr" onclick="zastosujFiltry()">Filtruj</button>
            <button class="btn-wyczysc" onclick="wyczyscFiltry()">Wyczyść filtry</button>
        </div>

        <!-- Prawa strona: Wyniki -->
        <div class="content">
            <h2>Aktualne Ogłoszenia</h2>
            <div id="wyniki">Ładowanie...</div>
        </div>
    </div>

    <!-- Przycisk dodawania -->
    <button class="fab" onclick="otworzModal()" title="Dodaj ogłoszenie">+</button>

    <!-- Modal dodawania ogłoszenia -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h3>Nowe ogłoszenie</h3>
            <input type="text" id="nowy-tytul" placeholder="Tytuł ogłoszenia">
            <input type="text" id="nowa-uczelnia" placeholder="Uczelnia (np. AGH)">
            <input type="text" id="nowy-przedmiot" placeholder="Przedmiot">
            <select id="nowa-forma">
                <option value="stacjonarna">Stacjonarna</option>
                <option value="online">Online</option>
            </select>
            <input type="number" id="nowy-dystans" step="0.1" placeholder="Dystans w km (np. 1.5)" value="1.0">
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px;">
                <button onclick="zamknijModal()"
                    style="padding: 6px 12px; background: #95a5a6; color: white; border: none; border-radius: 4px; cursor: pointer;">Anuluj</button>
                <button onclick="dodajOgłoszenie()"
                    style="padding: 6px 12px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer;">Zapisz</button>
            </div>
        </div>
    </div>

    <script>
        // Trwałość filtrów w adresie URL (Scenariusz BDD)
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.has('uczelnia')) document.getElementById('uczelnia').value = params.get('uczelnia');
            if (params.has('przedmiot')) document.getElementById('przedmiot').value = params.get('przedmiot');
            if (params.has('forma')) document.getElementById('forma').value = params.get('forma');
            if (params.has('max_dystans_km')) document.getElementById('dystans').value = params.get('max_dystans_km');

            pobierzOgłoszenia();
        });

        async function pobierzOgłoszenia() {
            let uczelnia = document.getElementById('uczelnia').value;
            let przedmiot = document.getElementById('przedmiot').value;
            let forma = document.getElementById('forma').value;
            let dystans = document.getElementById('dystans').value;

            let url = '/api/ogloszenia?';
            if (uczelnia) url += `uczelnia=${encodeURIComponent(uczelnia)}&`;
            if (przedmiot) url += `przedmiot=${encodeURIComponent(przedmiot)}&`;
            if (forma) url += `forma=${encodeURIComponent(forma)}&`;
            if (dystans) url += `max_dystans_km=${encodeURIComponent(dystans)}&`;

            let res = await fetch(url);
            let data = await res.json();

            let kontener = document.getElementById('wyniki');
            kontener.innerHTML = '';

            // Obsługa scenariusza BDD: Brak wyników
            if (data.message === "Brak ogłoszeń") {
                kontener.innerHTML = `
                    <div class="alert-box">
                        <p>Brak ogłoszeń</p>
                        <button class="btn-wyczysc" style="max-width: 200px; margin: 10px auto 0;" onclick="wyczyscFiltry()">Wyczyść filtry</button>
                    </div>`;
                return;
            }

            let lista = data.dane || [];
            lista.forEach(o => {
                kontener.innerHTML += `
                    <div class="card">
                        <h3>${o.tytul}</h3>
                        <p><strong>Uczelnia:</strong> ${o.uczelnia}</p>
                        <p><strong>Przedmiot:</strong> ${o.przedmiot}</p>
                        <div class="meta">Forma: ${o.forma} | Dystans: ${o.dystans_km} km</div>
                    </div>
                `;
            });
        }

        function zastosujFiltry() {
            let uczelnia = document.getElementById('uczelnia').value;
            let przedmiot = document.getElementById('przedmiot').value;
            let forma = document.getElementById('forma').value;
            let dystans = document.getElementById('dystans').value;

            let params = new URLSearchParams();
            if (uczelnia) params.set('uczelnia', uczelnia);
            if (przedmiot) params.set('przedmiot', przedmiot);
            if (forma) params.set('forma', forma);
            if (dystans) params.set('max_dystans_km', dystans);

            // Zapis w URL (Trwałość filtrów po odświeżeniu)
            window.history.pushState({}, '', window.location.pathname + (params.toString() ? '?' + params.toString() : ''));
            pobierzOgłoszenia();
        }

        function wyczyscFiltry() {
            document.getElementById('uczelnia').value = '';
            document.getElementById('przedmiot').value = '';
            document.getElementById('forma').value = '';
            document.getElementById('dystans').value = '';
            window.history.pushState({}, '', window.location.pathname);
            pobierzOgłoszenia();
        }

        function otworzModal() { document.getElementById('modal').style.display = 'flex'; }
        function zamknijModal() { document.getElementById('modal').style.display = 'none'; }

        async function dodajOgłoszenie() {
            let tytul = document.getElementById('nowy-tytul').value;
            let uczelnia = document.getElementById('nowa-uczelnia').value;
            let przedmiot = document.getElementById('nowy-przedmiot').value;
            let forma = document.getElementById('nowa-forma').value;
            let dystans_km = parseFloat(document.getElementById('nowy-dystans').value) || 0.0;

            if (!tytul || !uczelnia || !przedmiot) {
                alert("Wypełnij wszystkie pola!");
                return;
            }

            let res = await fetch('/api/ogloszenia', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tytul, uczelnia, przedmiot, forma, dystans_km })
            });

            if (res.ok) {
                zamknijModal();
                document.getElementById('nowy-tytul').value = '';
                document.getElementById('nowa-uczelnia').value = '';
                document.getElementById('nowy-przedmiot').value = '';
                pobierzOgłoszenia();
            }
        }
    </script>
</body>

</html>
